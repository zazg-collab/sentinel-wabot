name: sentinel-wabot

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinel-wabot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wabot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wabot}
      POSTGRES_DB: ${POSTGRES_DB:-wabot}
    ports:
      - "127.0.0.1:3502:5432"
    volumes:
      - wabot_pgdata:/var/lib/postgresql/data
    networks:
      - sentinel_wabot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wabot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7
    container_name: sentinel-wabot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:3503:6379"
    volumes:
      - wabot_redisdata:/data
    networks:
      - sentinel_wabot
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sentinel-wabot-api
    ports:
      - "3501:3501"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-wabot}:${POSTGRES_PASSWORD:-wabot}@postgres:5432/${POSTGRES_DB:-wabot}?schema=public&connection_limit=10&pool_timeout=20
      - REDIS_URL=redis://redis:6379
      - WA_SESSION_DIR=/app/data/wa-sessions
      - WA_MEDIA_DIR=/app/data/wa-media
      # Encrypts external product-source credentials (DB connection strings,
      # Google service-account keys) at rest. Set a strong random value in prod.
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:-}
      # Minutes between automatic product-stock re-syncs (0/unset = manual only).
      - PRODUCT_AUTOSYNC_MINUTES=${PRODUCT_AUTOSYNC_MINUTES:-}
    volumes:
      - wabot_sessions:/app/data/wa-sessions
      - wabot_media:/app/data/wa-media
    networks:
      - sentinel_wabot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3501/api/v1/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sentinel-wabot-web
    ports:
      - "3500:3500"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3501/api/v1}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3501}
    networks:
      - sentinel_wabot
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: sentinel-wabot-nginx
    profiles:
      - nginx
    ports:
      - "3580:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sentinel_wabot
    depends_on:
      - api
      - web
    restart: unless-stopped

networks:
  sentinel_wabot:
    driver: bridge

volumes:
  wabot_pgdata:
  wabot_redisdata:
  wabot_sessions:
  wabot_media:
